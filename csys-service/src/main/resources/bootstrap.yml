# Tomcat
server:
  port: 9219
  servlet:
    context-path: /csys
  tomcat:
    uri-encoding: UTF-8
# Spring
spring:
  application:
    # 应用名称
    name: doinner-curriculum
    # 远程服务名（原由 nacos 配置中心下发，本地运行时给一个合法服务名，避免 Feign 注册报非法主机名）
    remote:
      system: doinner-system
  profiles:
    # 环境配置
    active: dev
  # 移除整个spring.cloud.nacos 全部删除
  cloud:
    nacos:
      # 本地运行：关闭 nacos 配置中心与服务注册，避免 bootstrap 阶段去连 127.0.0.1:9848 失败
      config:
        enabled: false
      discovery:
        enabled: false
  # 本地mysql数据源（项目使用 dynamic-datasource，需放在 dynamic.datasource 下并指定 primary）
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://127.0.0.1:3306/my-curr?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
          username: root
          password: 123456

mybatis-plus:
  # 原由 nacos 下发，本地补上：mapper xml 位置与实体类型别名包（csys + dataparser 两套）
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.doinner.csys.domain,com.agileai.dataparser.domain
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 以下业务属性原由 nacos 配置中心下发，本地运行时在此补默认值（按需修改成真实值）
category:
  # 教学大纲分类id
  TeachingProgramme: 0
  # 培养方案分类id
  trainingPlan: 69ba4b5da5db953a32ac0c62

# dataparser 模块 mongodb 配置（仅在调用相关功能时才真正连接）
mongodb:
  url: mongodb://127.0.0.1:27017
  database: curriculum